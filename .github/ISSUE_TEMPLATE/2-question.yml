name: ❓ Question
description: Ask how to do something.
labels: [question]
body:
  - type: markdown
    attributes:
      value: "**This issue is public.** Don't include your email, phone number, sign-in links or passwords."
  - type: textarea
    id: question
    attributes:
      label: Your question
      placeholder: How do I add a WhatsApp button to my page?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Your page link (optional)
      placeholder: tilevue.com/yourname
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I didn't include my email, phone number or any password.
          required: true